<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#1A1412" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF6D00" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#00B0FF" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00B0FF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filters -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Pattern -->
    <pattern id="isoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 20 L 40 40 Z" fill="none" stroke="#FF6D00" stroke-opacity="0.05" stroke-width="1" />
      <path d="M 0 0 L 40 20 L 0 40 Z" fill="none" stroke="#00B0FF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(0.5deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; filter: drop-shadow(0 0 4px #FF6D00); }
      50% { opacity: 0.95; filter: drop-shadow(0 0 16px #FF6D00); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    .floating-tier { animation: float1 7s ease-in-out infinite; }
    .floating-node { animation: float2 5s ease-in-out infinite; }
    .pulsing-circuit { animation: pulseGlow 3.5s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8 6; animation: streamFlow 2.5s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="560" fill="url(#bgGrad)" />
  <rect width="1000" height="560" fill="url(#isoGrid)" />

  <!-- Background Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#FF6D00" opacity="0.08" filter="url(#ambientGlow)" />
  <circle cx="820" cy="380" r="160" fill="#00B0FF" opacity="0.07" filter="url(#ambientGlow)" />

  <!-- Top Header / HUD Bar -->
  <g transform="translate(50, 48)">
    <!-- Domain Tag Pill -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#FF6D00" fill-opacity="0.12" stroke="#FF6D00" stroke-width="1.2" />
    <circle cx="15" cy="15" r="4" fill="#FF6D00" filter="url(#intenseGlow)" />
    <text x="28" y="19" fill="#FF6D00" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DIGITAL TWINS &amp; SIMULATION</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">MATLAB &amp; Simulink Energy Lab</text>
    <!-- Subtitle -->
    <text x="0" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">Industrial Reference Models, Electro-Thermal Co-Simulation &amp; Grid Interconnection</text>
  </g>

  <!-- Top Right Metric HUD -->
  <g transform="translate(740, 48)">
    <rect x="0" y="0" width="210" height="74" rx="12" fill="#0D1527" fill-opacity="0.75" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="18" y="26" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ARCHITECTURE</text>
    <text x="18" y="50" fill="#00B0FF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">2.5D ISOMETRIC</text>
    <circle cx="185" cy="24" r="5" fill="#00E676" filter="url(#intenseGlow)" />
    <text x="150" y="50" fill="#94A3B8" font-family="monospace" font-size="11">ACTIVE</text>
  </g>

  <!-- ISOMETRIC 2.5D STAGE -->
  <!-- Centered Projection Group -->
  <g transform="translate(500, 340)">

    <!-- TIER 1: FOUNDATION / PHYSICAL BOUNDARY LAYER -->
    <g class="floating-tier" style="animation-delay: 0s;">
      <!-- Base Slab Top Face -->
      <polygon points="0,-100 280,40 0,180 -280,40" fill="url(#tier1Grad)" stroke="#FF6D00" stroke-width="1.8" filter="url(#dropShadow)" />
      <!-- Base Slab Left Extrusion -->
      <polygon points="-280,40 0,180 0,205 -280,65" fill="#050C1A" stroke="#FF6D00" stroke-opacity="0.4" stroke-width="1" />
      <!-- Base Slab Right Extrusion -->
      <polygon points="0,180 280,40 280,65 0,205" fill="#02060E" stroke="#FF6D00" stroke-opacity="0.3" stroke-width="1" />

      <!-- Isometric Grid Traces on Base -->
      <line x1="-140" y1="-30" x2="140" y2="110" stroke="#FF6D00" stroke-opacity="0.25" stroke-width="1" />
      <line x1="140" y1="-30" x2="-140" y2="110" stroke="#FF6D00" stroke-opacity="0.25" stroke-width="1" />
      <line x1="0" y1="-100" x2="0" y2="180" stroke="#FF6D00" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 4" />

      <!-- Tier 1 Label -->
      <text x="-240" y="100" fill="#FF6D00" opacity="0.6" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LAYER 01: HARDWARE &amp; PHYSICAL BOUNDS</text>
    </g>

    <!-- TIER 2: MIDDLE COMPUTATIONAL / DIGITAL TWIN LAYER -->
    <g class="floating-tier" style="animation-delay: -1.8s; transform: translateY(-55px);">
      <!-- Mid Slab Top Face -->
      <polygon points="0,-80 220,30 0,140 -220,30" fill="url(#tier2Grad)" stroke="#00B0FF" stroke-width="2" filter="url(#dropShadow)" />
      <!-- Mid Slab Left Extrusion -->
      <polygon points="-220,30 0,140 0,158 -220,48" fill="#07141E" stroke="#00B0FF" stroke-opacity="0.5" stroke-width="1" />
      <!-- Mid Slab Right Extrusion -->
      <polygon points="0,140 220,30 220,48 0,158" fill="#030B12" stroke="#00B0FF" stroke-opacity="0.4" stroke-width="1" />

      <!-- High-Tech Circuit Traces -->
      <polyline points="-120,0 -40,40 40,0 120,40" fill="none" stroke="#00B0FF" stroke-width="1.8" class="pulsing-circuit" />
      <polyline points="0,-50 -60,-20 -60,40 0,70" fill="none" stroke="#FF6D00" stroke-width="1.4" class="data-stream" />

      <!-- Tier 2 Label -->
      <text x="-200" y="10" fill="#00B0FF" opacity="0.8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LAYER 02: NEURAL / NUMERICAL CORE</text>
    </g>

    <!-- TIER 3: TOP APPLICATION & TELEMETRY LAYER -->
    <g class="floating-tier" style="animation-delay: -3.6s; transform: translateY(-110px);">
      <!-- Top Slab Face -->
      <polygon points="0,-60 160,20 0,100 -160,20" fill="url(#tier3Grad)" stroke="#FF6D00" stroke-width="2.2" filter="url(#intenseGlow)" />
      <!-- Top Slab Left Extrusion -->
      <polygon points="-160,20 0,100 0,114 -160,34" fill="#0A1E2B" stroke="#FF6D00" stroke-opacity="0.6" stroke-width="1" />
      <!-- Top Slab Right Extrusion -->
      <polygon points="0,100 160,20 160,34 0,114" fill="#051017" stroke="#00B0FF" stroke-opacity="0.5" stroke-width="1" />

      <!-- Center Hex Core / Reactor -->
      <polygon points="0,-25 35,-8 35,25 0,42 -35,25 -35,-8" fill="#1A1412" stroke="url(#primaryGrad)" stroke-width="2" />
      <circle cx="0" cy="8" r="14" fill="#FF6D00" filter="url(#intenseGlow)" class="pulsing-circuit" />
      <circle cx="0" cy="8" r="6" fill="#FFFFFF" />

      <!-- Tier 3 Label -->
      <text x="-120" y="-35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">LAYER 03: ILLUSTRATIVE TELEMETRY</text>
    </g>

    <!-- FLOATING 2.5D DATA NODES -->
    <!-- Node A: Left Floating Data Pillar -->
    <g class="floating-node" style="animation-delay: -0.5s; transform: translate(-230px, -60px);">
      <!-- Top Face -->
      <polygon points="0,-18 30,-3 0,12 -30,-3" fill="#FF6D00" stroke="#FFFFFF" stroke-width="1" />
      <!-- Left Face -->
      <polygon points="-30,-3 0,12 0,42 -30,27" fill="#00838F" />
      <!-- Right Face -->
      <polygon points="0,12 30,-3 30,27 0,42" fill="#00ACC1" />
      <line x1="0" y1="42" x2="0" y2="120" stroke="#FF6D00" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
      <text x="-40" y="-24" fill="#FF6D00" font-family="monospace" font-size="9" font-weight="700">NODE_ALPHA</text>
    </g>

    <!-- Node B: Right Floating Data Pillar -->
    <g class="floating-node" style="animation-delay: -2.3s; transform: translate(220px, -90px);">
      <!-- Top Face -->
      <polygon points="0,-18 30,-3 0,12 -30,-3" fill="#00B0FF" stroke="#FFFFFF" stroke-width="1" />
      <!-- Left Face -->
      <polygon points="-30,-3 0,12 0,42 -30,27" fill="#007E33" />
      <!-- Right Face -->
      <polygon points="0,12 30,-3 30,27 0,42" fill="#00C851" />
      <line x1="0" y1="42" x2="0" y2="150" stroke="#00B0FF" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
      <text x="5" y="-24" fill="#00B0FF" font-family="monospace" font-size="9" font-weight="700">NODE_BETA</text>
    </g>

    <!-- Node C: Top Floating Apex Cube -->
    <g class="floating-node" style="animation-delay: -3.8s; transform: translate(0px, -200px);">
      <!-- Top Face -->
      <polygon points="0,-22 36,-4 0,14 -36,-4" fill="#FFFFFF" stroke="#FF6D00" stroke-width="1.5" />
      <!-- Left Face -->
      <polygon points="-36,-4 0,14 0,46 -36,28" fill="#FF6D00" />
      <!-- Right Face -->
      <polygon points="0,14 36,-4 36,28 0,46" fill="#00B0FF" />
      <!-- Glowing Beacon Ray -->
      <line x1="0" y1="46" x2="0" y2="90" stroke="url(#primaryGrad)" stroke-width="2" class="pulsing-circuit" />
      <text x="-45" y="-30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800">HISTORICAL VISUAL</text>
    </g>

    <!-- Pulsing Vertical Data Beams Connecting Tiers -->
    <line x1="-120" y1="20" x2="-120" y2="-90" stroke="#FF6D00" stroke-width="1.5" class="data-stream" opacity="0.8" />
    <line x1="120" y1="20" x2="120" y2="-90" stroke="#00B0FF" stroke-width="1.5" class="data-stream" opacity="0.8" />
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" fill="#64748B" font-family="monospace" font-size="11">ENGINEERED BY MOHAMMAD REZWAN KHAN | PROFILE: mohammadrezwankhan | REPO: matlab-simulink-energy-lab</text>
    <text x="760" y="0" fill="#FF6D00" font-family="monospace" font-size="11" font-weight="700">ARCHIVED ILLUSTRATION</text>
  </g>
<style>@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</svg>