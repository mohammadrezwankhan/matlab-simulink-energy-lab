<text class="small-label on-color" x="481" y="213" text-anchor="middle">uniform prescribed heat Qcell / N to each control volume</text>
<text class="micro" x="480" y="177" text-anchor="middle">through-thickness coordinate z  →</text>
<!-- Both broad-face fluid boundaries are independent. -->
<rect x="56" y="260" width="142" height="102" rx="13" class="fill-estimation component"/>
<text class="small-label on-color" x="127" y="286" text-anchor="middle">left fluid</text><text class="micro on-color" x="127" y="307" text-anchor="middle">T∞,L = 25 °C</text><text class="micro on-color" x="127" y="332" text-anchor="middle">hL = 35 W/m²K</text><text class="micro on-color" x="127" y="351" text-anchor="middle">Gboundary,L</text>
