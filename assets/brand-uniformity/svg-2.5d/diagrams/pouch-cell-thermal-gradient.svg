<!-- The adjacent-node conduction chain and the two combined half-cell/convection boundaries. -->
<path d="M227 375h504" fill="none" stroke="#ff9f1c" stroke-width="2.5"/>
<path d="M250 375h34 M322 375h34 M394 375h34 M466 375h34 M538 375h34 M610 375h34 M682 375h34" fill="none" stroke="#ffe66d" stroke-width="1.5" stroke-dasharray="3 5"/>
<path d="M227 368v15 M731 368v15" stroke="#ff9f1c" stroke-width="2"/>
<text class="small-label" x="480" y="399" text-anchor="middle">Gz = kz·A/Δz  ·  signed interface flows cancel in the whole-cell sum</text>
<rect x="78" y="415" width="526" height="43" rx="11" class="capsule"/>
<text class="small-label" x="341" y="433" text-anchor="middle">Cnode·dTi/dt = Qcell/N + Gz(Ti−1−Ti) + Gz(Ti+1−Ti)</text>
<text class="micro" x="341" y="450" text-anchor="middle">interior-node balance; flow direction follows ΔT, end nodes use separate boundary conductance</text>
<rect x="627" y="415" width="255" height="43" rx="11" class="capsule"/>
<text class="small-label" x="754" y="433" text-anchor="middle">source defaults: N = 15 · L = 8 mm</text>
<text class="micro" x="754" y="450" text-anchor="middle">illustrative properties; not cell-calibrated</text>
<rect class="note" x="40" y="478" width="880" height="54" rx="12"/>
<circle cx="62" cy="505" r="7" fill="#d94a4a"/>
<text class="note-text" x="80" y="501">SCOPE</text><text class="micro" x="80" y="519">1D cell-centred model: uniform heat, asymmetric face cooling. No in-plane, tab, layer-data, or safety claims.</text>
