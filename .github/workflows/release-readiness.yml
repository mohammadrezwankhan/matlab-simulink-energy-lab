name: Release readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.m'
      - '**/*.csv'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/release-readiness.yml'

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2026a
          products: Simulink
      - name: Analyze code, run checks and demos, inspect generated models
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: buildtool -continueOnFailure check test demos simulink
      - name: Retain exact-commit evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-audit-${{ github.sha }}
          path: validation-artifacts/
          if-no-files-found: error
