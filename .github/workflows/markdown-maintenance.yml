name: Markdown maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "llms.txt"
      - "project-metadata.yml"
      - "codemeta.json"
      - ".github/ISSUE_TEMPLATE/reproduction_report.yml"
      - ".github/scripts/validate-project-metadata.sh"
      - ".github/workflows/markdown-maintenance.yml"
  pull_request:
    paths:
      - "**.md"
      - "llms.txt"
      - "project-metadata.yml"
      - "codemeta.json"
      - ".github/ISSUE_TEMPLATE/reproduction_report.yml"
      - ".github/scripts/validate-project-metadata.sh"
      - ".github/workflows/markdown-maintenance.yml"

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: List tracked Markdown inputs
        shell: bash
        run: |
          git ls-files '*.md' > "$RUNNER_TEMP/markdown-inputs.txt"
          printf '%s\n' llms.txt >> "$RUNNER_TEMP/markdown-inputs.txt"

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress --files-from '${{ runner.temp }}/markdown-inputs.txt' --exclude '^https://github\.com/mohammadrezwankhan/matlab-simulink-energy-lab/blob/main/docs/(model-selection-by-decision|scope-comparison)\.md$'
          fail: true

      - name: Check project metadata and llms.txt portability
        shell: bash
        run: bash .github/scripts/validate-project-metadata.sh
