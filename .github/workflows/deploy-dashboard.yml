# Bundle generation replaces workflow with legacy, workflow, or existing-workflow.
# legacy: GitHub publishes the default branch /docs. existing-workflow: another
# reviewed workflow publishes docs. Both modes retain the validation job below.
name: Flagship dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs
            assets
          sparse-checkout-cone-mode: true
      - name: Validate static dashboard and lesson configuration
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          docs = Path('docs')
          index = docs / 'index.html'
          assert index.is_file(), 'Missing docs/index.html'
          html = index.read_text(encoding='utf-8')
          assert 'data-flagship-repo="' + os.environ['EXPECTED_REPOSITORY'] + '"' in html, 'Dashboard repository marker mismatch'
          assert 'data-flagship-version="1.0"' in html, 'Dashboard version marker mismatch'
          config = json.loads((docs / 'lesson-config.json').read_text(encoding='utf-8'))
          assert isinstance(config, dict), 'Lesson configuration must be an object'
          for item in docs.rglob('*'):
              assert not item.is_symlink(), 'Pages artifacts cannot contain symbolic links: ' + str(item)
          assert '<script src="https://' not in html and "<script src='https://" not in html, 'Dashboard scripts must be self-contained'
          print('Static dashboard, identity, and lesson JSON validated.')
          PY

  deploy:
    if: ${{ 'workflow' == 'workflow' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static docs
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
