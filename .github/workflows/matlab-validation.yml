name: MATLAB validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.m"
      - "**/*.slx"
      - "**/*.csv"
      - "examples/bess-unified-control/**"
      - ".github/workflows/matlab-validation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.m"
      - "**/*.slx"
      - "**/*.csv"
      - "examples/bess-unified-control/**"
      - ".github/workflows/matlab-validation.yml"

permissions:
  contents: read

concurrency:
  group: matlab-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-base-matlab:
    name: Validate Base MATLAB without Simulink
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MATLAB R2026a only
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2026a

      - name: Run toolbox-free checks
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: buildtool base

  validate-examples:
    name: Validate executable examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 90c83f3654ee6648b31cc3cb9553670455e74c01

      - name: Set up MATLAB R2025b for compatibility evidence
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2025b
          products: Simulink

      - name: Run model checks
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: diary('r2025b-compatibility.log'); fprintf('Tested commit 90c83f3654ee6648b31cc3cb9553670455e74c01\n'); disp(version); disp(computer); ver; addpath('examples'); report=run_all_checks(true,true,true); fprintf('\nComplete check summary:\n%s\n',jsonencode(report.checks)); diary off; assert(report.all_checks_passed,'One or more compatibility checks failed.');

      - name: Upload commit-bound compatibility log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r2025b-compatibility-90c83f3654ee6648b31cc3cb9553670455e74c01
          path: r2025b-compatibility.log
          retention-days: 14
          if-no-files-found: error

  validate-bess:
    name: Validate unified BESS control
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2026a
          products: Simulink

      - name: Run focused unified BESS checks
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('examples/bess-unified-control'); run('examples/bess-unified-control/check_bess_unified_control.m')

      - name: Generate commit-bound BESS evidence
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('examples/bess-unified-control'); generate_bess_validation_evidence(getenv('GITHUB_SHA'))

      - name: Upload BESS validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bess-validation-${{ github.sha }}
          path: |
            examples/bess-unified-control/validation/results.json
            examples/bess-unified-control/validation/scenario-*.png
          if-no-files-found: error
