name: Citation metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CITATION.cff"
      - "codemeta.json"
      - "project-metadata.yml"
      - ".github/workflows/citation-validation.yml"
  pull_request:
    paths:
      - "CITATION.cff"
      - "codemeta.json"
      - "project-metadata.yml"
      - ".github/workflows/citation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate citation metadata
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: "--validate"

      - name: Validate CodeMeta JSON and CFF consistency
        shell: bash
        run: |
          jq empty codemeta.json
          test "$(jq -r '."@context"' codemeta.json)" = \
            "https://w3id.org/codemeta/3.1"

          cff_version="$(sed -n 's/^version: "\(.*\)"/\1/p' CITATION.cff)"
          cff_date="$(sed -n 's/^date-released: "\(.*\)"/\1/p' CITATION.cff)"
          cff_repository="$(sed -n 's/^repository-code: "\(.*\)"/\1/p' CITATION.cff)"
          cff_license="$(sed -n 's/^license: \(.*\)/\1/p' CITATION.cff)"
          cff_orcid="$(sed -n 's/^    orcid: "\(.*\)"/\1/p' CITATION.cff)"

          test "$(jq -r '.version' codemeta.json)" = "$cff_version"
          # A proposed release omits both publication dates; published
          # metadata supplies the same ISO date in both formats.
          test "$(jq -r '.datePublished // empty' codemeta.json)" = "$cff_date"
          if test -n "$cff_date"; then
            [[ "$cff_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          fi
          test "$cff_version" = \
            "$(sed -n 's/^version: "\(.*\)"/\1/p' project-metadata.yml)"
          test "$(jq -r '.codeRepository' codemeta.json)" = "$cff_repository"
          test "$(jq -r '.sameAs' codemeta.json)" = "$cff_repository"
          test "$(jq -r '.url' codemeta.json)" = \
            "$(sed -n 's/^landing_page_url: "\(.*\)"/\1/p' project-metadata.yml)"
          test "$(jq -r '.license' codemeta.json | sed 's#https://spdx.org/licenses/##; s/\.html$//')" = "$cff_license"
          test "$(jq -r '.author."@id"' codemeta.json)" = "$cff_orcid"
